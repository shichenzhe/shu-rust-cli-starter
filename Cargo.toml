[package]
name = "my-cli"
default-run = "my-cli"
version = "0.1.0"
edition = "2021"
authors = ["{{AUTHOR}}"]
description = "{{APP_DESCRIPTION}}"
license = "MIT"
repository = "https://github.com/{{REPO_OWNER}}/{{REPO_NAME}}"
readme = "README.md"
keywords = ["cli", "starter"]
categories = ["command-line-utilities"]

[dependencies]
# CLI 框架
clap = { version = "4.6", features = ["derive"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 配置文件
toml = "1"

# 错误处理
thiserror = "2"
anyhow = "1.0"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP 客户端（demo 域 async 调用）
# 注意：reqwest 0.13 起默认 TLS 换成 rustls(aws-lc-rs)，部分企业 MITM 网络下会
# `tls handshake eof`——此处显式 native-tls（系统证书链）并保留默认的
# charset/http2/system-proxy（default-features=false 会丢掉这三项，需手动补回）。
reqwest = { version = "0.13", features = ["json", "native-tls", "charset", "http2", "system-proxy"], default-features = false }

# 异步运行时
tokio = { version = "1", features = ["rt-multi-thread"] }

# 目录路径
dirs = "7"

# 终端密码输入（不回显，config init 交互式配置）
rpassword = "7"

# CSV 输出
csv = "1.4"

# 自更新（GitHub Releases）
self_update = { version = "1.3", features = ["reqwest", "github", "rustls", "progress-bar", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate"], default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2"
predicates = "3"
